plugins {
  id "war"
  id "java"
}

java {
  toolchain { languageVersion = JavaLanguageVersion.of(17) } // EE 10 = Java 17
}

repositories { mavenCentral() }

dependencies {
  compileOnly "jakarta.platform:jakarta.jakartaee-api:10.0.0"
  implementation "org.apache.activemq:activemq-client:5.8.0"
  compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:10.0.0'
  compileOnly("org.projectlombok:lombok:1.18.42")
  annotationProcessor("org.projectlombok:lombok:1.18.42")

  implementation 'io.minio:minio:8.5.17'

  compileOnly project(":resource-adapter")
}

tasks.war {
  archiveFileName.set("ee-consumer.war") // имя артефакта
}
